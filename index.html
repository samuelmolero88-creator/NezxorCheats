<!DOCTYPE html>
<html lang="es">
<head>

        body {

            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;

        }

        .contenedor {
            padding: 60px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #bdbdc7;
            font-size: 18px;
        }

        .boton {
            display: block;
            max-width: 300px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 12px;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .boton:hover {
            background: #8b7cff;
        }

        .tarjeta {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 20px;
            background: #151522;
        }

</head>

<body>

    <div class="contenedor">

        <h1>🔥 Nexz Web</h1>

        <p>Bienvenido a mi página web 📱</p>

        <div class="tarjeta">
            <h2>🎮 Mi espacio</h2>
            <p>Gaming, proyectos y contenido.</p>

            <a class="boton" href="#">🎮 Free Fire</a>
            <a class="boton" href="#">📱 Mis redes</a>

</html>
